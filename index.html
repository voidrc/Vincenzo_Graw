<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vincenzo Graw</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top-bar">
    <div class="container">
      <span class="faction" id="faction"></span>
      <h1 id="agent-name"></h1>
      <span class="rank" id="agent-rank"></span>
    </div>
  </header>

  <main class="container layout">
    <section class="agent-card">
      <div class="avatar-wrap">
        <div class="avatar" id="avatar"></div>
        <span class="rank avatar-rank" id="avatar-rank"></span>
      </div>
      <dl class="agent-meta" id="agent-meta"></dl>
      <div class="stats" id="stats"></div>
    </section>

    <section class="detail-panel">
      <nav class="tabs" id="tabs"></nav>
      <div class="tab-content" id="tab-content"></div>
    </section>
  </main>

  <footer class="container">
    <p>Grey Hat operator — built for Netlify.</p>
  </footer>
</body>
</html>
